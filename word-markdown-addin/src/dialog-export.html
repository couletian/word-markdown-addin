<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>导出 Markdown</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      font-size: 13px; color: #1a1a1a; background: #fafafa;
    }
    h1 { margin: 0 0 4px; font-size: 15px; }
    .stats { font-size: 11px; color: #666; margin-bottom: 10px; }
    .actions { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    button, a.btn {
      font-family: inherit; font-size: 12.5px; padding: 7px 14px;
      border-radius: 6px; border: 1px solid #d0d0d0; background: #fff;
      color: #1a1a1a; cursor: pointer; text-decoration: none; display: inline-block;
    }
    button:hover, a.btn:hover { background: #f0f0f0; }
    .primary { background: #2b579a; border-color: #2b579a; color: #fff; font-weight: 600; }
    .primary:hover { background: #3566ad; }
    pre {
      margin: 0; max-height: 300px; overflow: auto; padding: 10px;
      background: #fff; border: 1px solid #e0e0e0; border-radius: 6px;
      font-family: Consolas, monospace; font-size: 11.5px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
    }
    .status { font-size: 11px; color: #107c10; margin-left: 4px; }
  </style>
</head>
<body>
  <h1>已导出为 Markdown</h1>
  <div class="stats" id="stats"></div>

  <div class="actions">
    <a id="download" class="btn primary" download>下载 .md 文件</a>
    <button id="copy">复制到剪贴板</button>
    <button id="close">关闭</button>
    <span class="status" id="status"></span>
  </div>

  <pre id="preview"></pre>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script>
    (function () {
      'use strict';
      var payload = null;

      function render(data) {
        payload = data;
        document.getElementById('preview').textContent = data.markdown.slice(0, 100000);
        var s = data.stats || {};
        document.getElementById('stats').textContent =
          '字符 ' + s.chars + ' · 行 ' + s.lines + ' · 词 ' + s.words +
          ' · 标题 ' + s.headings + ' · 表格行 ' + s.tables + ' · 链接 ' + s.links;
        var dl = document.getElementById('download');
        dl.href = data.dataUrl;
        dl.setAttribute('download', data.filename);
      }

      document.getElementById('copy').addEventListener('click', function () {
        if (!payload) return;
        navigator.clipboard.writeText(payload.markdown).then(function () {
          document.getElementById('status').textContent = '已复制';
          setTimeout(function () { document.getElementById('status').textContent = ''; }, 2000);
        });
      });

      document.getElementById('close').addEventListener('click', function () {
        Office.context.ui.messageParent(JSON.stringify({ action: 'close' }));
      });

      Office.onReady(function () {
        Office.context.ui.addHandlerAsync(
          Office.EventType.DialogParentMessageReceived,
          function (arg) {
            var msg = {};
            try { msg = JSON.parse(arg.message); } catch (e) { msg = {}; }
            if (msg.action === 'data') render(msg.payload);
          }
        ).then(function () {
          Office.context.ui.messageParent(JSON.stringify({ action: 'ready' }));
        });
      });
    })();
  </script>
</body>
</html>
